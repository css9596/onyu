<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adaptive icon foreground (Android): wordmark only on transparent bg.
  Scaled into ~66% safe zone so it stays inside any launcher mask shape.
  Background color is the same sunset gradient defined in
  pubspec.yaml's adaptive_icon_background, but here we ship the
  foreground glyph standalone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wordmark, scaled to safe zone -->
  <g transform="translate(0, -40)">
    <text x="512" y="640"
          text-anchor="middle"
          font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif"
          font-size="440"
          font-weight="900"
          fill="#FFF8E7"
          letter-spacing="-22"
          filter="url(#textGlow)">온</text>
  </g>

  <!-- Small sparkle for character -->
  <g transform="translate(736, 360)" fill="#FFF8E7">
    <path d="M 0 -22 L 4 -4 L 22 0 L 4 4 L 0 22 L -4 4 L -22 0 L -4 -4 Z"/>
  </g>
</svg>
