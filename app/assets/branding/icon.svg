<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon: brand purple frame + cream portrait circle + character.
  Self-contained (no external <use>) so rsvg-convert can flatten in one pass.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A5A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8A5A0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portraitClip">
      <circle cx="512" cy="512" r="412"/>
    </clipPath>
  </defs>

  <!-- Brand background -->
  <rect width="1024" height="1024" fill="#5E35B1"/>

  <!-- Cream portrait disk -->
  <circle cx="512" cy="512" r="412" fill="#FAF6F0"/>

  <!-- Character, clipped to portrait disk so collar bleeds nicely into frame -->
  <g clip-path="url(#portraitClip)" transform="translate(0, 60)">
    <!-- Hair (back silhouette) -->
    <path d="M 512 220
             C 360 220 280 360 280 540
             C 280 720 360 880 512 880
             C 664 880 744 720 744 540
             C 744 360 664 220 512 220 Z"
          fill="#1F1410"/>

    <!-- Bun -->
    <ellipse cx="512" cy="240" rx="98" ry="74" fill="#1F1410"/>
    <ellipse cx="512" cy="220" rx="44" ry="22" fill="#0F0805" opacity="0.6"/>
    <circle cx="512" cy="232" r="9" fill="#D4A85C"/>

    <!-- Face -->
    <ellipse cx="512" cy="560" rx="232" ry="272" fill="#F5D5B5"/>

    <!-- Cheeks -->
    <ellipse cx="380" cy="640" rx="60" ry="40" fill="url(#cheek)"/>
    <ellipse cx="644" cy="640" rx="60" ry="40" fill="url(#cheek)"/>

    <!-- Eyebrows -->
    <path d="M 372 504 Q 412 488 452 504" stroke="#3A2A20" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 572 504 Q 612 488 652 504" stroke="#3A2A20" stroke-width="11" fill="none" stroke-linecap="round"/>

    <!-- Eyes (closed) -->
    <path d="M 365 568 Q 412 590 460 568" stroke="#2A1810" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 564 568 Q 612 590 660 568" stroke="#2A1810" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 458 568 L 466 580" stroke="#2A1810" stroke-width="6" stroke-linecap="round"/>
    <path d="M 566 568 L 558 580" stroke="#2A1810" stroke-width="6" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 512 620 Q 502 680 512 700 Q 522 706 530 698" stroke="#D4A089" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M 472 758 Q 512 786 552 758" stroke="#A05050" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- Neck + hanbok -->
    <path d="M 446 808 L 432 900 L 592 900 L 578 808 Z" fill="#F5D5B5"/>
    <path d="M 80 1024 L 376 880 L 512 980 L 648 880 L 944 1024 Z" fill="#5E35B1"/>
    <path d="M 376 880 L 512 980 L 648 880" stroke="#FFFFFF" stroke-width="22" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
