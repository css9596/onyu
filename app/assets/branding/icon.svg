<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept C1 — Sunset gradient wordmark.
  Warm peach → coral → indigo gradient + bold cream "온" + sparkle accent.
  Vibe: 인스타 wallpaper, 헤이딜러/29CM 느낌, 20-30대 친화.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#FFC9A8"/>
      <stop offset="35%" stop-color="#FF8870"/>
      <stop offset="70%" stop-color="#A04CB8"/>
      <stop offset="100%" stop-color="#3D2A8E"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sunset)"/>

  <!-- Soft floating blob accent (back layer) -->
  <circle cx="780" cy="240" r="100" fill="#FFF4E0" opacity="0.18"/>
  <circle cx="200" cy="820" r="140" fill="#FFD0B8" opacity="0.22"/>

  <!-- Wordmark -->
  <text x="512" y="660"
        text-anchor="middle"
        font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif"
        font-size="640"
        font-weight="900"
        fill="#FFF8E7"
        letter-spacing="-30"
        filter="url(#textGlow)">온</text>

  <!-- Sparkle accent -->
  <g transform="translate(840, 360)" fill="#FFF8E7">
    <path d="M 0 -36 L 6 -6 L 36 0 L 6 6 L 0 36 L -6 6 L -36 0 L -6 -6 Z"/>
  </g>
  <g transform="translate(180, 200)" fill="#FFF8E7" opacity="0.7">
    <path d="M 0 -22 L 4 -4 L 22 0 L 4 4 L 0 22 L -4 4 L -22 0 L -4 -4 Z"/>
  </g>
</svg>
