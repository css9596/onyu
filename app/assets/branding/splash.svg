<?xml version="1.0" encoding="UTF-8"?>
<!--
  Splash screen logo: wordmark on transparent bg.
  Designed to sit on the brand sunset background defined in
  flutter_native_splash config (pubspec.yaml).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <text x="256" y="340"
        text-anchor="middle"
        font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif"
        font-size="320"
        font-weight="900"
        fill="#FFF8E7"
        letter-spacing="-15"
        filter="url(#textGlow)">온</text>

  <!-- Tiny sparkle accent -->
  <g transform="translate(380, 170)" fill="#FFF8E7">
    <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z"/>
  </g>
</svg>
