<?xml version="1.0" encoding="UTF-8"?>
<!--
  Onyu character — placeholder design.
  A stylized portrait of the persona ("50대 후반 여성 명리학자, 차분하면서 따뜻한 톤").
  Closed peaceful eyes, gentle smile, simple hanbok collar in brand purple.

  Coordinate system: 1024×1024, centered.
  Replace this whole file with a designer's SVG to upgrade.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A5A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8A5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hair (back silhouette, slight pear shape) -->
  <path d="M 512 220
           C 360 220 280 360 280 540
           C 280 720 360 880 512 880
           C 664 880 744 720 744 540
           C 744 360 664 220 512 220 Z"
        fill="#1F1410"/>

  <!-- Hair bun on top (쪽진 머리) -->
  <ellipse cx="512" cy="240" rx="98" ry="74" fill="#1F1410"/>
  <ellipse cx="512" cy="220" rx="44" ry="22" fill="#0F0805" opacity="0.6"/>

  <!-- Hair pin / decoration (subtle gold dot) -->
  <circle cx="512" cy="232" r="9" fill="#D4A85C"/>

  <!-- Face -->
  <ellipse cx="512" cy="560" rx="232" ry="272" fill="#F5D5B5"/>

  <!-- Cheeks (soft blush) -->
  <ellipse cx="380" cy="640" rx="60" ry="40" fill="url(#cheek)"/>
  <ellipse cx="644" cy="640" rx="60" ry="40" fill="url(#cheek)"/>

  <!-- Eyebrows (warm thin) -->
  <path d="M 372 504 Q 412 488 452 504"
        stroke="#3A2A20" stroke-width="11" fill="none"
        stroke-linecap="round"/>
  <path d="M 572 504 Q 612 488 652 504"
        stroke="#3A2A20" stroke-width="11" fill="none"
        stroke-linecap="round"/>

  <!-- Eyes — closed, gentle arc (peaceful smile) -->
  <path d="M 365 568 Q 412 590 460 568"
        stroke="#2A1810" stroke-width="11" fill="none"
        stroke-linecap="round"/>
  <path d="M 564 568 Q 612 590 660 568"
        stroke="#2A1810" stroke-width="11" fill="none"
        stroke-linecap="round"/>

  <!-- Eyelashes hint (tiny ticks) -->
  <path d="M 458 568 L 466 580" stroke="#2A1810" stroke-width="6" stroke-linecap="round"/>
  <path d="M 566 568 L 558 580" stroke="#2A1810" stroke-width="6" stroke-linecap="round"/>

  <!-- Nose (gentle bridge) -->
  <path d="M 512 620 Q 502 680 512 700 Q 522 706 530 698"
        stroke="#D4A089" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- Mouth (subtle smile) -->
  <path d="M 472 758 Q 512 786 552 758"
        stroke="#A05050" stroke-width="9" fill="none"
        stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 446 808 L 432 900 L 592 900 L 578 808 Z" fill="#F5D5B5"/>

  <!-- Hanbok collar (V-shape in brand purple) -->
  <path d="M 80 1024
           L 376 880
           L 512 980
           L 648 880
           L 944 1024 Z"
        fill="#5E35B1"/>

  <!-- 동정 (white inner trim) -->
  <path d="M 376 880 L 512 980 L 648 880"
        stroke="#FFFFFF" stroke-width="22"
        fill="none" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
